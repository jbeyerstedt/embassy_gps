[package]
name = "embassy_gps"
version = "0.1.0"
edition = "2024"
description = "Lightweight Embassy GPS wrapper and extensible architecture"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["embassy", "gps", "embedded", "no-std"]
categories = ["embedded", "no-std", "asynchronous"]

[features]
default = ["defmt"]

defmt = [
    "dep:defmt",
    "embassy-nrf/defmt",
    "embassy-time/defmt",
    "embedded-io-async/defmt",
    "heapless/defmt",
]

log-04 = [
    "dep:log"
]

nrf = [
    "dep:embassy-nrf",
]

esp32c3 = [
    "dep:esp-hal",
    "esp-hal/esp32c3"
]

[dependencies]
chrono = { version = "0.4", default-features = false }
defmt = { version = "1", optional = true }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.10", optional = true, features = ["time-driver-rtc1", "gpiote", "nrf52840"] }
embassy-time = { version = "0.5", features = [] }
embedded-io-async = { version = "0.7.0", features = [] }
heapless = {version = "0.9.2", features = [] }
log = { version = "0.4.27", optional = true }
nmea = { version = "0.7.0", default-features = false, features = ["GGA", "RMC"] }
esp-hal = { version = "1.0.0", optional = true }
